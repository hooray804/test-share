name: Filter AdGuard CNAME Trackers

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build-filtered-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update Track Filter and Push
        run: |
          FILE="track.txt"
          SOURCE_URL="https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/refs/heads/master/platforms/windows/filters/3.txt"

          git fetch origin main
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "New commits were pushed to the repository. Exiting to prevent conflict."
            exit 0
          fi

          curl -fsSL "$SOURCE_URL" -o raw_3.txt

          python3 - << 'EOF'
          import sys

          with open("raw_3.txt", "r", encoding="utf-8") as f:
              lines = f.readlines()

          filtered = []
          in_cname = False
          started = False
          ended = False

          for i, raw in enumerate(lines):
              s = raw.strip()

              if not ended:
                  if not in_cname:
                      if s.startswith("!---") and i + 1 < len(lines):
                          nxt = lines[i + 1].strip()
                          if (
                              nxt.startswith("! SECTION: CNAME disguised tracking networks")
                              or nxt.startswith("! NOTE: CNAME disguised tracking networks")
                              or nxt.startswith("!-------------- CNAME mail trackers")
                          ):
                              continue

                      if (
                          s.startswith("! SECTION: CNAME disguised tracking networks")
                          or (s.startswith("! NOTE: CNAME disguised tracking networks") and "end" not in s)
                          or s.startswith("!-------------- CNAME mail trackers")
                      ):
                          in_cname = True
                          started = True
                          continue
                  else:
                      if s.startswith("! !SECTION: CNAME disguised tracking networks"):
                          in_cname = False
                          ended = True
                          continue

                      if s.startswith("! NOTE: CNAME disguised tracking networks end"):
                          nxt = lines[i + 1].strip() if i + 1 < len(lines) else ""
                          if not nxt.startswith("! !SECTION: CNAME disguised tracking networks"):
                              in_cname = False
                              ended = True
                          continue
                      continue

              if not in_cname:
                  filtered.append(raw)

          if not started or not ended or in_cname:
              print(f"ERROR: boundary check failed (started={started}, ended={ended}, in_cname={in_cname})", file=sys.stderr)
              sys.exit(1)

          with open("track.txt", "w", encoding="utf-8") as f:
              f.writelines(filtered)

          print(f"Original lines: {len(lines)}, Filtered lines: {len(filtered)}, Removed: {len(lines) - len(filtered)}")
          EOF

          rm -f raw_3.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No changes to $FILE. Skipping commit."
            exit 0
          fi

          git commit -m "chore: update $FILE (strip CNAME trackers)"
          git push origin main
