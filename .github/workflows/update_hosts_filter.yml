name: Update Hosts Filter

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Download and Filter Hosts
        run: |
          python3 -c "
          import urllib.request
          from datetime import datetime

          url = 'https://someonewhocares.org/hosts/hosts'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8', errors='ignore')
          except Exception as e:
              print(f'Download failed: {e}')
              exit(1)

          exclude_keywords = [
              'googletagservices.com',
              'firebaselogging.googleapis.com',
              'video-stats.video.google.com',
              'doubleclick.net',
              'adservice.google',
              'googlesyndication.com',
              'googleadservices.com'
          ]

          today = datetime.now().strftime('%Y.%m.%d')
          header = f'! Title: someonewhocares.org DNS filter\n! Version: {today}\n\n'

          lines = content.splitlines()
          filtered_lines = [
              line for line in lines 
              if not any(kw in line for kw in exclude_keywords)
          ]

          output_filename = 'someonewhocares.org.txt'
          with open(output_filename, 'w', encoding='utf-8') as f:
              f.write(header + '\n'.join(filtered_lines) + '\n')

          print(f'Successfully updated {output_filename}')
          "

      - name: Commit, Push and Purge Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add someonewhocares.org.txt
          
          if git diff --staged --quiet; then
            echo "No changes detected in someonewhocares.org.txt"
          else
            git commit -m "chore: update someonewhocares.org.txt filter"
            git push origin main

            echo "Waiting 3 seconds for GitHub raw sync..."
            sleep 3

            echo "Purging jsDelivr CDN cache..."
            PURGE_RES=$(curl -s "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@main/someonewhocares.org.txt")
            echo "jsDelivr response: $PURGE_RES"
          fi
